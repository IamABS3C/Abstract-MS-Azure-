name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The previous version of this workflow listed template paths by hand, so every new
# or moved template silently fell out of coverage. Everything below DISCOVERS what to
# check - by walking the tree or reading solutions/solution.manifest.json - so
# coverage cannot rot.
#
# Non-trivial logic lives in solutions/ci/*.py|sh rather than inline: a heredoc or a
# quote-heavy regex inside a YAML block scalar is a reliable way to break a workflow
# file in a way that is hard to see in review.

jobs:
  json-lint:
    name: JSON parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every JSON file parses (// comments tolerated)
        run: python3 solutions/ci/json-lint.py .

  templates:
    name: Templates compile + UI contracts hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: az bicep install

      # THE hard gate. Compiles every .bicep it finds, fails if the committed ARM is
      # stale, and verifies each portal UI against its template:
      #   * every UI output is a real template parameter
      #   * every required parameter is supplied by the UI
      #   * every steps()/basics() reference resolves
      #   * the UI MODEL matches the deployment SCOPE - createUiDefinition cannot bind
      #     a portal deployment above a resource group, so those need a Form view
      # None of that is visible to `az bicep build`, and all of it otherwise breaks in
      # front of a customer instead of in front of us.
      - name: Validate template and UI contracts
        run: python3 solutions/scripts/validate-templates.py

      # Deploy-to-Azure URLs embed owner/repo/branch and are generated from the
      # manifest. If someone hand-edits a button or renames the repo without
      # regenerating, fail here rather than ship a 404 to a customer.
      - name: Deploy links are current
        run: python3 solutions/scripts/gen-deploy-links.py --check

      # The public Pages site carries the same deploy buttons. It is generated from
      # the manifest too, so it cannot be allowed to drift independently.
      - name: GitHub Pages site is current
        run: python3 solutions/scripts/gen-pages.py --check

  shell-lint:
    name: Shell scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every shell script
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if bash -n "$f" 2>/dev/null; then
              echo "ok   : $f"
            else
              echo "FAIL : $f"
              bash -n "$f" || true
              fail=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -not -path '*/.venv/*' -print0)
          exit $fail
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          find . -name '*.sh' -not -path './.git/*' -not -path '*/.venv/*' -exec shellcheck -S warning {} + || true

  powershell-lint:
    name: PowerShell parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1
        shell: pwsh
        run: |
          $fail = $false
          Get-ChildItem -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '\.git|\.venv' } |
            ForEach-Object {
              $errors = $null
              $tokens = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors) {
                Write-Host "FAIL : $($_.FullName)"
                $errors | ForEach-Object { Write-Host "   line $($_.Extent.StartLineNumber): $($_.Message)" }
                $fail = $true
              }
              else {
                Write-Host "ok   : $($_.FullName)"
              }
            }
          if ($fail) { exit 1 }

  secrets-scan:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secret-shaped literals
        run: bash solutions/ci/secrets-scan.sh .

  arm-ttk:
    name: ARM TTK (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisory deliberately: arm-ttk enforces Azure Quickstart conventions, several
      # of which these templates break on purpose (secrets never in outputs,
      # scope-specific schemas, Form-view UIs it does not understand). Read it for
      # signal; do not let it gate a release.
      - name: Run arm-ttk over every ARM template and portal UI
        shell: pwsh
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/Azure/arm-ttk.git $env:RUNNER_TEMP/arm-ttk
          Import-Module $env:RUNNER_TEMP/arm-ttk/arm-ttk/arm-ttk.psd1
          Get-ChildItem -Path solutions/templates -Recurse -Include *.azuredeploy.json, *.createUiDefinition.json |
            ForEach-Object {
              Write-Host "::group::arm-ttk $($_.Name)"
              Test-AzTemplate -TemplatePath $_.FullName | Format-Table -AutoSize
              Write-Host "::endgroup::"
            }
