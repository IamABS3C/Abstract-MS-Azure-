# Publishes the deployment console (docs/index.html, generated by solutions/scripts/gen-pages.py)
# to GitHub Pages. Only the docs/ folder is uploaded: publishing the repository root would
# also serve every other file in the repo as a web page.
name: Publish the deployment console

on:
  push:
    branches: ["main"]
    paths: ["docs/**", ".github/workflows/jekyll-gh-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the console only
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
